name: Windows build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build app
        shell: pwsh
        run: .\packaging\build-windows.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer-windows.iss'

      - name: Upload app folder
        uses: actions/upload-artifact@v4
        with:
          name: NexusCam-windows-folder
          path: dist\NexusCam

      - name: Upload setup installer
        uses: actions/upload-artifact@v4
        with:
          name: NexusCam-windows-setup
          path: dist\installer\NexusCam-Setup-v*.exe
